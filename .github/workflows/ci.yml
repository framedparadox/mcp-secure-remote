name: CI

on:
  pull_request:
  push:
    branches:
      - release/npm
      - main
      - develop

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Confirm npm pack is JS-only
        run: |
          # Skip prepack (already built above). prepack/tsup logs on stdout
          # break `npm pack --json` and `$(npm pack --silent)`.
          npm pack --ignore-scripts
          tarball=$(ls mcp-secure-remote-*.tgz)
          echo "Packed $tarball"
          tar -tzf "$tarball"
          if tar -tzf "$tarball" | grep -E '\.py$|(^|/)pyproject\.toml$|(^|/)src/mcp_secure_remote/'; then
            echo "Python files leaked into the npm tarball" >&2
            exit 1
          fi
          rm -f "$tarball"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Build and confirm wheel is Python-only
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-py
          wheel=$(ls dist-py/*.whl)
          if unzip -l "$wheel" | grep -E '\.ts$|src/lib/|package\.json'; then
            echo "TypeScript or npm files leaked into the wheel" >&2
            unzip -l "$wheel"
            exit 1
          fi
          unzip -l "$wheel" | grep mcp_secure_remote
