name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build --outdir dist-py

      - name: List dist-py contents
        run: ls -la dist-py/

      - name: Check metadata and confirm sdist is Python-only
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist-py/*
          sdist=$(ls dist-py/*.tar.gz)
          echo "sdist $sdist"
          tar -tzf "$sdist"
          if tar -tzf "$sdist" | grep -E '\.ts$|(^|/)src/lib/|(^|/)package\.json$|(^|/)tsup\.config\.ts$'; then
            echo "TypeScript or npm files leaked into the sdist" >&2
            exit 1
          fi
          wheel=$(ls dist-py/*.whl)
          if unzip -l "$wheel" | grep -E '\.ts$|src/lib/|package\.json'; then
            echo "TypeScript or npm files leaked into the wheel" >&2
            unzip -l "$wheel"
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py
          path: dist-py/
          retention-days: 1

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-secure-remote
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-py
          path: dist-py/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py

      - name: Create deployment status
        if: success()
        run: echo "✅ Package published to PyPI"
