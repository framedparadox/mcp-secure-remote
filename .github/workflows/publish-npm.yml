name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm npm / PyPI versions match
        run: npm run check:version

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Confirm npm pack is JS-only
        run: |
          npm pack --ignore-scripts
          tarball=$(ls mcp-secure-remote-*.tgz)
          echo "Packed $tarball"
          tar -tzf "$tarball"
          if tar -tzf "$tarball" | grep -E '\.py$|(^|/)pyproject\.toml$|(^|/)src/mcp_secure_remote/'; then
            echo "Python files leaked into the npm tarball" >&2
            exit 1
          fi
          rm -f "$tarball"

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}